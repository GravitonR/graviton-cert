name: GravitonCert Kernel Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan & Lean 4 toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Build Lean 4 proofs
        run: lake build

      - name: Run Lean 4 kernel axiom audit (rejects sorryAx & custom axioms)
        run: lake exe graviton-cert

      - name: Upload Epistemic Manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-manifest
          path: |
            epistemic-manifest.json
            VERIFICATION.md
